services:
  target:
    build:
      context: ./target_app
    ports:
      - "127.0.0.1:${LAB_PORT:-8081}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  crawler:
    build:
      context: ./crawler
    profiles:
      - tools
    depends_on:
      target:
        condition: service_healthy
    volumes:
      - ./data:/app/data
