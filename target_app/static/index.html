<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星桥商城 · 本地采集实验站</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #f4f7fb; color: #172033; }
    header { padding: 32px max(24px, calc((100vw - 1080px) / 2)); background: #172554; color: white; }
    header p { color: #c7d2fe; margin-bottom: 0; }
    main { max-width: 1080px; margin: 28px auto; padding: 0 24px 48px; }
    form { display: flex; gap: 12px; background: white; padding: 18px; border-radius: 14px; box-shadow: 0 8px 28px #17255412; }
    input { flex: 1; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px 14px; font-size: 16px; }
    button { border: 0; border-radius: 10px; padding: 0 22px; background: #4f46e5; color: white; font-weight: 700; }
    #status { min-height: 24px; color: #475569; margin: 18px 2px; }
    #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 16px; }
    article { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #eef2ff; color: #4338ca; font-size: 12px; }
    .price { color: #e11d48; font-size: 24px; font-weight: 800; margin: 14px 0 8px; }
    .meta { color: #64748b; font-size: 13px; line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <h1>星桥商城 · 本地采集实验站</h1>
    <p>这是仓库自带的授权目标，用于练习动态接口、会话签名、限流与数据质量。</p>
  </header>
  <main>
    <form id="search-form">
      <input id="query" value="保温杯" aria-label="搜索词" maxlength="100">
      <button type="submit">搜索</button>
    </form>
    <div id="status">正在建立本地实验会话……</div>
    <section id="products" aria-live="polite"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
